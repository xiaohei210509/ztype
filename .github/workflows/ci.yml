name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Swift toolchain
        run: swift --version
      - name: Swift regression tests
        run: ./script/test.sh
      - name: Setup helper tests
        run: python3 -m unittest discover -s script/tests -v
      - name: Shell syntax
        run: bash -n script/build_and_run.sh script/test.sh script/build_icon.sh script/package_dmg.sh
